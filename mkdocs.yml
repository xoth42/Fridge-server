site_name: Fridge Monitor Server
site_url: https://xoth42.github.io/Fridge-server/
repo_url: https://github.com/xoth42/Fridge-server
edit_uri: ''

theme:
  name: material
  features:
    - content.code.copy
    - navigation.tabs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Operations: operations.md
  - Reference: reference.md
  - Dashboard Renders:
      - Cooling Water Temp (C): render-cooling-water-temp.md
      - Cooling Water Temp (F): render-cooling-water-temp-f.md
      - Dodo Flow: render-dodo-flow.md
      - Dodo Pressure: render-dodo-pressure.md
      - Dodo Temperature: render-dodo-temp.md
      - Manny Flow: render-manny-flow.md
      - Manny Pressure: render-manny-pressure.md
      - Manny Temperature: render-manny-temp.md