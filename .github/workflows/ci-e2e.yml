name: ci-e2e

# Tier 3: integration + full e2e alert-fires-and-email-delivered test via Mailpit.
# Catches Alertmanager routing failures and email delivery regressions.
# TODO: external routing (real SMTP, Slack) not tested — requires live credentials.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext jq python3 python3-pip

      - name: Set up CI environment
        run: |
          cp test/.env.ci .env
          source .env
          export $(grep -v '^#' .env | xargs)
          envsubst < config/alertmanager/alertmanager.yml.template \
            > config/alertmanager/alertmanager.runtime.yml

      - name: Build and start CI stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --build

      - name: Wait for Grafana
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || echo 000)
            [ "$code" = "200" ] && echo "Grafana ready." && break
            [ "$i" -eq 30 ] && echo "Grafana timed out." && exit 1
            sleep 2
          done

      - name: Bootstrap SA token and restart alert-api
        run: bash scripts/ci_bootstrap.sh

      - name: Install Python test dependencies
        run: pip install -e ".[test]"

      - name: Push synthetic fridge metrics
        run: python3 test/testdata/pushtestmetrics.py --pushgateway-url http://localhost:9091

      - name: Wait for Prometheus scrape cycle
        run: sleep 16

      - name: Run pytest suite (includes e2e mail test)
        env:
          GF_ADMIN_USER: admin
          GF_ADMIN_PASSWORD: ci-admin-password
          GRAFANA_URL: http://localhost:3000
          ALERT_API_URL: http://localhost:8000/api
          PUSHGATEWAY_URL: http://localhost:9091
          MAILPIT_URL: http://localhost:8025
          TEST_FRIDGE: fridge-manny
          TEST_METRIC: ch1_t_kelvin
        run: python -m pytest test/ -v

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
