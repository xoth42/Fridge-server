name: ci-integration

# Tier 2: boot + metrics smoke tests + full pytest suite.
# Catches alert-api logic bugs, policy routing regressions, and schema errors.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext jq python3 python3-pip

      - name: Set up CI environment
        run: |
          cp test/.env.ci .env
          set -a; source .env; set +a
          envsubst < config/alertmanager/alertmanager.yml.template \
            > config/alertmanager/alertmanager.runtime.yml

      - name: Build and start CI stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --build

      - name: Wait for Grafana
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || echo 000)
            [ "$code" = "200" ] && echo "Grafana ready." && break
            [ "$i" -eq 30 ] && echo "Grafana timed out." && exit 1
            sleep 2
          done

      - name: Bootstrap SA token and restart alert-api
        run: bash scripts/ci_bootstrap.sh

      - name: Install Python test dependencies
        run: pip install -e ".[test]"

      - name: Push synthetic fridge metrics
        run: python3 test/testdata/pushtestmetrics.py --pushgateway-url http://localhost:9091

      - name: Wait for Prometheus to scrape the metric
        # prometheus.yml sets scrape_interval: 45s, so 16s is not enough.
        # Poll until the metric appears (up to 90s) rather than sleeping a fixed
        # duration that would fail intermittently depending on scrape timing.
        run: |
          for i in $(seq 1 18); do
            result=$(curl -sS 'http://localhost:9090/api/v1/query?query=%7Bjob%3D%22sensor_data%22%7D')
            count=$(echo "$result" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',{}).get('result',[])))" 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "Metric visible in Prometheus ($count series)."
              break
            fi
            [ "$i" -eq 18 ] && echo "Metric not visible after 90s." && exit 1
            echo "Waiting for scrape... ($((i * 5))s elapsed)"
            sleep 5
          done

      - name: Verify Prometheus has the metric
        run: |
          RESPONSE=$(curl -sS 'http://localhost:9090/api/v1/query?query=%7Bjob%3D%22sensor_data%22%7D')
          python3 test/testdata/check_prometheus_metric.py "$RESPONSE"

      - name: Verify Grafana datasource and dashboards
        run: |
          set -a; source .env; set +a
          AUTH="${GF_ADMIN_USER}:${GF_ADMIN_PASSWORD}"
          DS=$(curl -sS -u "$AUTH" http://localhost:3000/api/datasources/name/Prometheus)
          python3 test/testdata/check_grafana_datasource.py "$DS"

      - name: Run pytest suite
        env:
          GF_ADMIN_USER: admin
          GF_ADMIN_PASSWORD: ci-admin-password
          GRAFANA_URL: http://localhost:3000
          ALERT_API_URL: http://localhost:8000/api
          # Use a fridge/metric that pushtestmetrics.py actually pushes.
          TEST_FRIDGE: fridge-manny
          TEST_METRIC: ch1_t_kelvin
        run: python -m pytest test/ -v

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
