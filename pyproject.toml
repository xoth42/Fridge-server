[project]
name = "fridge-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "httpx==0.27.2",
    "pyyaml==6.0.2",
    "pydantic==2.9.2",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.14",
    "pymdown-extensions==10.21.3",
]
test = [
    "pytest>=9.0",
    "python-dotenv>=1.0",
]

# Install everything for local full-stack development.
dev = [
    "fridge-server[api,docs,test]",
]
